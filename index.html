<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Movie List</title>

        <style>
            body {
                background: #222831;
                color: #ddd;
                font-family: Arial, Helvetica, sans-serif;
            }

            h1 {
                margin-left: 40px;
                font-size: 40px;
                font-weight: 800;
            }
            #search-bar {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 20px;
            }

            #search-bar button {
                padding: 10px;
                border: 2px solid green;
                border-radius: 10px;
                background: transparent;
                cursor: pointer;
                color: #ddd;
                font-size: 18px;
            }

            #search-bar button:hover {
                background: #067a06;
            }

            #search-bar button:active {
                background: #075307;
            }

            #search-bar input {
                padding: 10px;
                width: 20%;
                border: 2px solid gray;
                border-radius: 10px;
                background: transparent;
                color: #ddd;
                font-size: 18px;
       
            }
            #movie-container {
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
                padding: 20px;
                justify-content: center;
            }

            .movie {
                margin: 20px;
                padding: 10px;
                border: 1px solid #ddd;
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 200px;
                word-wrap: break-word;
                background: #222831;
            } 

            img {
                padding: 20px;
                max-width: 100px;
            }
        </style>
    </head>
    <body>
        <h1>Movie List</h1>

        <div id="search-bar">
            <input type="text" id="query" placeholder="Search for movies..." />
            <button onclick="searchMovies()">Search</button>
        </div>

        <div id="movie-container"></div>

        <script>
            const movieContainer = document.getElementById('movie-container');

            function searchMovies() {
                const searchTerm = document.getElementById('query').value;

                if (searchTerm === '') {
                    movieContainer.innerHTML = '<p>Please type something first!</p>';
                    return;
                }

                fetchMovies(searchTerm);
            }

            const fetchMovies = async (searchTerm) => {
                try {
                    movieContainer.innerHTML = '<p>Loading...</p>';

                    const response = await fetch(`/api/search?q=${searchTerm}`);
                    const data = await response.json();

                    movieContainer.innerHTML = '';

                    if (data.Response === "True") {
                        data.Search.forEach(movie => {
                            const movieDiv = document.createElement('div');
                            movieDiv.classList.add('movie');
                            movieDiv.innerHTML = `<img src="${movie.Poster}" alt="${movie.Title}"> <h2>${movie.Title}</h2> <p>Year: ${movie.Year}</p>`;
                            movieContainer.appendChild(movieDiv);
                        });
                    } else {
                        movieContainer.innerHTML = `<p>No movies found for "${searchTerm}"</p>`;
                    }
                } catch (error) {
                    console.error('Error fetching movie data:', error);
                    movieContainer.innerHTML = `<p>There was an error fetching the movie data.</p>`;
                }
            };
        </script>
    </body>
</html>
